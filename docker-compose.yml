services:
  mongodb:
    image: mongo:7
    container_name: gigprotect-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backend:
    image: quickcommerce-insurance-ai-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gigprotect-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB=gigprotect_ai
      - ALLOWED_ORIGINS=http://localhost:3000
      - SCHEDULER_ENABLED=true
      - SCHEDULER_INTERVAL_MINUTES=15
      - SECRET_KEY=change-this-in-production
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  frontend:
    image: quickcommerce-insurance-ai-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gigprotect-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
      - NEXT_TELEMETRY_DISABLED=1
    ports:
      - "3000:3000"

volumes:
  mongo_data:

